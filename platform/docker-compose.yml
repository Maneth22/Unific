services:
  postgres:
    image: postgres:16-alpine
    container_name: unific_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: unific
      POSTGRES_PASSWORD: unific_dev_password
      POSTGRES_DB: unific_platform
    ports:
      - "55432:5432"
    volumes:
      - unific_pgdata:/var/lib/postgresql/data
    # Caps this container so it can't grow unbounded and starve the bare
    # uvicorn process (which itself hosts the REST API, APScheduler cron,
    # and every live-translation agent) on a 1vCPU/2GB droplet.
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: unific_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - unific_redis_data:/data
    # Small session cache only (WhatsApp same-day turns/counters) — doesn't
    # need much; same rationale as postgres's mem_limit above.
    mem_limit: 128m

volumes:
  unific_pgdata:
  unific_redis_data:
